name: Recovery Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo bc bison build-essential zip curl flex g++-multilib gcc-multilib gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zlib1g-dev python3

      - name: Init TWRP Source
        run: |
          mkdir ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j4

      - name: Clone Device Tree
        run: |
          cd ~/twrp
          git clone --depth=1 -b vnd_kh6_h6513-user-12-SP1A.210812.016-590061-release-keys \
          https://github.com/rahelaakter2233-star/android_device_tecno_TECNO-KH6.git \
          device/tecno/TECNO-KH6

      - name: Build Recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_TECNO-KH6-eng
          mka recoveryimage

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TECNO-KH6
          path: ~/twrp/out/target/product/TECNO-KH6/recovery.img
